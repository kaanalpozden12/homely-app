<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Loftrobin · Second-hand finds from London neighbours</title>
    <meta name="description" content="Buy and sell second-hand furniture and household items in London, from neighbours who speak your language. Pick up and pay in person." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Loftrobin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Link previews on Instagram, WhatsApp, iMessage and Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Loftrobin" />
    <meta property="og:title" content="Loftrobin · Second-hand finds from London neighbours" />
    <meta property="og:description" content="From neighbours who speak your language. Pick up and pay in person." />
    <meta property="og:image" content="https://www.loftrobin.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://www.loftrobin.com/" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://onukvcqeocqfvyojodzy.supabase.co" />
    <meta name="theme-color" content="#F7F5F0" />
    <!-- Brand typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without holding up the first paint; text shows in the system font for a moment, then switches. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" /></noscript>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #f7f5f0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Use the brand typeface for all text. Icons keep their own font because theirs is set inline. */
      #root div[dir="auto"], #root input, #root textarea {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Stops iPhones zooming in when a text box is tapped */
      input, textarea {
        font-size: 16px !important;
      }
    </style>
  </head>

  <body>
    <noscript>Loftrobin needs JavaScript. Please turn it on, or open this page in another browser.</noscript>
    <div id="root"></div>
  </body>
</html>
